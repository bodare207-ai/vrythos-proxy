services:
  - type: web
    name: vrythos-cloudflare-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node cloudflare-proxy.js
    envVars:
      - key: PORT
        value: 3001
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false  # You'll set this manually in Render dashboard
      - key: CLOUDFLARE_API_TOKEN
        sync: false