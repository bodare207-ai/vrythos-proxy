services:
  - type: web
    name: vrythos-cloudflare-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node cloudflare-proxy.js
    envVars:
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
        value: YOUR_ACCOUNT_ID_HERE
      - key: CLOUDFLARE_API_TOKEN
        sync: false
        value: YOUR_API_TOKEN_HERE
